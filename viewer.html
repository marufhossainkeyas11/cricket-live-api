<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Cricket Score — Live</title>
<meta name="description" content="Live cricket scores — watch matches in real time"/>
<meta name="theme-color" content="#242e42"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Rajdhani:wght@700&family=Montserrat:wght@600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#111827;--bg2:#1a2332;--bg3:#242e42;--bg4:#2d3a52;
  --bdr:rgba(255,255,255,.07);--text:#e6edf3;--t2:#a0aec0;--t3:#4a5568;
  --grn:#22c55e;--grn2:rgba(34,197,94,.12);--ylw:#f0b429;
  --red:#f87171;--blue:#60a5fa;--blue2:#1565C0;
  --four:#3b82f6;--six:#f0b429;--rs:10px;
  --f:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:var(--f);cursor:pointer;border:none}

.wrap{max-width:520px;margin:0 auto;padding-bottom:64px}

/* ── Header ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:var(--bg3);
  border-bottom:1px solid var(--bdr);
  position:sticky;top:0;z-index:50;
}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:40px;height:40px}
.hdr-name { font-size: 20px; letter-spacing: 1px; line-height: 1; }
.bc, .bs { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-style: italic; letter-spacing: 0.06em; text-transform: uppercase;}
.bc { color: #1565C0;}
.bs { color: #D32F2F;}
.hdr-right{display:flex;align-items:center;gap:10px}
.live-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.5px;padding:4px 10px;border-radius:20px;background:var(--grn2);color:var(--grn)}
.live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--grn);animation:blink 1.2s infinite}
.live-pill.off{background:rgba(255,255,255,.04);color:var(--t3)}
.live-pill.off::before{background:var(--t3);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── State ── */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:65vh;gap:14px;text-align:center;padding:32px 20px}
.state-ico{font-size:52px}
.state-ttl{font-size:20px;font-weight:700}
.state-sub{font-size:14px;color:var(--t2);line-height:1.7}

/* ── Password screen ── */
.pw-box{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);padding:24px 20px;max-width:320px;width:100%;text-align:left}
.pw-box h2{font-size:16px;font-weight:700;margin-bottom:6px}
.pw-box p{font-size:13px;color:var(--t2);margin-bottom:16px}
.pw-inp{width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:7px;color:var(--text);font-size:14px;padding:10px 12px;margin-bottom:10px}
.pw-inp:focus{outline:none;border-color:rgba(96,165,250,.4)}
.pw-btn{width:100%;background:var(--blue2);color:#fff;border-radius:7px;padding:10px;font-size:14px;font-weight:700}
.pw-btn:hover{background:#1976D2}
.pw-err{font-size:12px;color:var(--red);margin-top:6px;min-height:18px}

/* ── Match List ── */
.list-hd{padding:18px 16px 6px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3)}
.match-card{display:block;margin:0 12px 10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);padding:14px 16px;transition:border-color .15s,background .15s}
.match-card:hover{border-color:rgba(96,165,250,.35);background:var(--bg3)}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mc-teams{font-size:15px;font-weight:700}
.mc-vs{color:var(--t3);font-size:12px;margin:0 6px}
.mc-badge{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:20px}
.mc-live{background:var(--grn2);color:var(--grn)}
.mc-end{background:rgba(255,255,255,.04);color:var(--t3)}
.mc-lock{background:rgba(240,180,41,.08);color:var(--ylw);margin-left:4px}
.mc-meta{display:flex;gap:12px;font-size:12px;color:var(--t2);align-items:center}
.mc-score{font-family:var(--fm);font-size:20px;font-weight:700;color:var(--grn)}
.mc-ago{margin-left:auto;font-size:11px}

/* ── Scoreboard ── */
.sb{background:linear-gradient(135deg,#1a2d45,#111827);padding:20px 16px 16px;border-bottom:1px solid var(--bdr);position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;top:-50px;right:-30px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(21,101,192,.2),transparent 70%);pointer-events:none}
.sb-inn{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.sb-team{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:8px}
.sb-score{display:flex;align-items:baseline;gap:3px;margin-bottom:12px}
.sb-runs{font-family:var(--fm);font-size:54px;font-weight:700;line-height:1}
.sb-wk{font-family:var(--fm);font-size:28px;font-weight:700;color:var(--t2)}
.sb-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.smi{display:flex;flex-direction:column;gap:1px}
.sml{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
.smv{font-family:var(--fm);font-size:15px;font-weight:700}
.sb-bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.sb-fill{height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:2px;transition:width .6s ease}
.target-row{display:flex;align-items:center;justify-content:space-between;background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.18);border-radius:6px;padding:10px 14px;margin-top:12px}
.target-lbl{font-size:11px;color:var(--ylw);font-weight:600}
.target-val{font-family:var(--fm);font-size:18px;font-weight:700;color:var(--ylw)}

/* ── Inn1 strip ── */
.inn1-strip{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.15);border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.inn1-lbl{font-size:11px;color:var(--blue);font-weight:600}
.inn1-sc{font-family:var(--fm);font-size:16px;font-weight:700}

/* ── Sections ── */
.sec{padding:14px 16px;border-bottom:1px solid var(--bdr)}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-ttl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3)}

/* ── Balls ── */
.balls-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ball{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--fm)}
.bd{background:rgba(255,255,255,.05);color:var(--t3)}
.bgh{background:rgba(255,255,255,.03);color:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.06)}
.b4{background:rgba(59,130,246,.2);color:var(--four);border:1px solid rgba(59,130,246,.3)}
.b6{background:rgba(240,180,41,.18);color:var(--six);border:1px solid rgba(240,180,41,.3)}
.bW{background:rgba(248,113,113,.2);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.bw,.bnb,.bb{font-size:10px}
.bw{background:rgba(248,113,113,.1);color:var(--red)}
.bnb{background:rgba(251,191,36,.1);color:#fbbf24}
.bb{background:rgba(96,165,250,.1);color:var(--blue)}
.br{background:rgba(34,197,94,.15);color:var(--grn)}
.over-info{font-size:11px;color:var(--t3);margin-top:4px}

/* ── Batsmen ── */
.bat-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.bat-ico{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.bat-nm{font-size:14px;font-weight:600}
.bat-st{font-size:12px;color:var(--t2);margin-top:2px;font-family:var(--fm)}
.c4{color:var(--four)}.c6{color:var(--six)}
.bat-div{height:1px;background:var(--bdr);margin:2px 0}

/* ── Bowl ── */
.bfr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.bfr:last-child{border-bottom:none}
.bfr-nm{font-size:13px;font-weight:600;min-width:90px;flex-shrink:0}
.bfr-nm.cur{color:var(--ylw)}
.bfr-st{display:flex;gap:10px;font-size:12px;font-family:var(--fm);color:var(--t2)}

/* ── Scorecard ── */
.sc-inn{display:flex;align-items:center;justify-content:space-between;background:rgba(21,101,192,.15);border-left:3px solid var(--blue2);padding:10px 12px;border-radius:0 6px 6px 0;margin:12px 0 8px}
.sc-inn:first-child{margin-top:0}
.sc-inn.inn2{background:rgba(185,28,28,.12);border-left-color:#991b1b}
.sc-hd{display:flex;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
.sc-row{display:flex;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03);align-items:center}
.sc-nm{flex:1;font-size:13px;min-width:0}
.sc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-how{font-size:10px;color:var(--t3);margin-top:1px}
.sc-out .sc-name{color:var(--t2)}
.st{font-family:var(--fm);font-size:13px;text-align:right;flex-shrink:0}
.st-r{width:30px;color:var(--grn)}.st-b{width:36px;color:var(--t2)}
.st-4{width:24px;color:var(--four)}.st-6{width:24px;color:var(--six)}.st-sr{width:42px}
.st-ov{width:34px}.st-w{width:22px;color:var(--red)}.st-eco{width:40px}
.sc-ext{font-size:11px;color:var(--t3);padding:6px 0;border-top:1px solid var(--bdr);margin-top:4px}

/* ── Result ── */
.result-banner{background:linear-gradient(135deg,rgba(21,101,192,.2),rgba(240,180,41,.1));border:1px solid rgba(240,180,41,.25);border-radius:var(--rs);padding:22px 16px;text-align:center;margin:16px}
.res-trophy{font-size:40px;margin-bottom:8px}
.res-msg{font-size:19px;font-weight:700;margin-bottom:4px}
.res-sub{font-size:13px;color:var(--t2)}

/* ── Bottom bar ── */
.btm{position:fixed;bottom:0;left:0;right:0;background:var(--bg3);border-top:1px solid var(--bdr);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--t3);z-index:40;max-width:100%}
.btm-time{font-family:var(--fm);color:var(--t2);font-weight:600}

/* ── PWA popup ── */
#pwa-popup{position:fixed;bottom:70px;left:12px;right:12px;max-width:496px;margin:0 auto;background:var(--bg3);border:1px solid rgba(96,165,250,.25);border-radius:14px;padding:16px;z-index:9998;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#pwa-popup.show{display:block}
.pwa-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pwa-ico{width:44px;height:44px;border-radius:10px;background:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.pwa-ttl{font-size:15px;font-weight:700}
.pwa-sub{font-size:12px;color:var(--t2);margin-top:2px}
.pwa-btns{display:flex;gap:8px;margin-top:12px}
.pwa-install{flex:1;background:var(--blue2);color:#fff;border-radius:8px;padding:9px;font-size:13px;font-weight:700}
.pwa-dismiss{flex:0;background:rgba(255,255,255,.06);color:var(--t2);border-radius:8px;padding:9px 14px;font-size:13px}

/* ── Flash ── */
@keyframes fg{0%,100%{background:linear-gradient(135deg,#1a2d45,#111827)}50%{background:linear-gradient(135deg,rgba(34,197,94,.15),#111827)}}
@keyframes fr{0%,100%{background:linear-gradient(135deg,#1a2d45,#111827)}50%{background:linear-gradient(135deg,rgba(248,113,113,.15),#111827)}}
.flash-g{animation:fg .6s ease}
.flash-r{animation:fr .6s ease}
</style>
</head>

      <span class="live-pill off" id="livePill">—</span>

<script>
// ── Route ─────────────────────────────────────
// /match/matchId  → live view
// /              → landing list
const API  = window.location.origin;
const path = location.pathname;
const m    = path.match(/^\/match\/(.+)$/);
const matchId = m ? decodeURIComponent(m[1]) : null;

let es       = null;
let curData  = null;
let enteredPw = '';

// ── Boot ──────────────────────────────────────
if (matchId) {
  document.getElementById('btm').style.display = 'flex';
  startConnect();
} else {
  loadList();
}

// PWA
initPWA();

// ─────────────────────────────────────────────
//  LANDING — match list
// ─────────────────────────────────────────────
async function loadList() {
  try {
    const r = await fetch(`${API}/api/matches`);
    const d = await r.json();
    renderList(d.matches || []);
  } catch {
    renderList([]);
  }
}

function renderList(matches) {
  const app = document.getElementById('app');
  let html = hdrH('Live Matches', false);

  if (!matches.length) {
    html += `<div class="state">
      <div class="state-ico">🏏</div>
      <div class="state-ttl">No live matches</div>
      <div class="state-sub">No active matches right now.<br>Open a scorer link to start broadcasting.</div>
    </div>`;
    app.innerHTML = html;
    return;
  }

  html += `<div class="list-hd">Active Matches (${matches.length})</div>`;
  matches.forEach(mc => {
    const live = !mc.done && (Date.now() - mc.updatedAt < 20000);
    html += `<a class="match-card" href="/match/${encodeURIComponent(mc.matchId)}">
      <div class="mc-top">
        <span class="mc-teams">${esc(mc.teamA)} <span class="mc-vs">vs</span> ${esc(mc.teamB)}</span>
        <span>
          <span class="mc-badge ${live ? 'mc-live' : 'mc-end'}">${live ? 'LIVE' : 'ENDED'}</span>
          ${mc.hasPassword ? '<span class="mc-badge mc-lock">🔒</span>' : ''}
        </span>
      </div>
      <div class="mc-meta">
        <span class="mc-score">${mc.score}</span>
        <span>${mc.overs} ov · Inn ${mc.innings}</span>
        <span class="mc-ago">${ago(mc.updatedAt)}</span>
      </div>
    </a>`;
  });

  app.innerHTML = html;
}

// ─────────────────────────────────────────────
//  SSE CONNECT
// ─────────────────────────────────────────────
function startConnect(pw) {
  if (pw !== undefined && pw !== null) enteredPw = pw;
  if (es) { es.close(); es = null; }
  clearTimeout(reconnectTimer);

  const url = `${API}/api/live?matchId=${encodeURIComponent(matchId)}${enteredPw ? '&password=' + encodeURIComponent(enteredPw) : ''}`;
  es = new EventSource(url);

  es.onopen = () => { setPill(true); setMsg('Live stream connected'); };

  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.error === 'not_found')         { showNotFound(); es.close(); return; }
    if (d.error === 'password_required') { es.close(); es = null; showPasswordScreen(); return; }
    curData = d;
    render(d);
    setBtmTime();
  };

  es.addEventListener('reconnect', () => {
    es.close(); es = null;
    reconnectTimer = setTimeout(() => startConnect(enteredPw), 400);
  });

  es.onerror = () => {
    if (!es) return;
    setPill(false); setMsg('Reconnecting…');
    es.close(); es = null;
    reconnectTimer = setTimeout(() => startConnect(enteredPw), 4000);
  };
}

// ─────────────────────────────────────────────
//  PASSWORD SCREEN
// ─────────────────────────────────────────────
function showPasswordScreen() {
  document.getElementById('app').innerHTML = hdrH('', false) + `
    <div class="state">
      <div class="pw-box">
        <h2>🔒 Password Required</h2>
        <p>This match is password protected.</p>
        <input class="pw-inp" id="pwInp" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkPw()"/>
        <button class="pw-btn" onclick="checkPw()">Watch Live</button>
        <div class="pw-err" id="pwErr"></div>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('pwInp')?.focus(), 100);
}

function checkPw() {
  const pw = document.getElementById('pwInp')?.value.trim();
  if (!pw) { document.getElementById('pwErr').textContent = 'Enter rigt Password'; return; }
  document.getElementById('pwErr').textContent = 'Connecting…';
  enteredPw = pw;
  startConnect(pw);
}

// ─────────────────────────────────────────────
//  RENDER MATCH
// ─────────────────────────────────────────────
function render(d) {
  const { setup: s, match: mt, inn1, inn1FullData, screen, resultData } = d;
  if (!s || !mt) return;

  if (screen === 'result' && resultData) { renderResult(d); return; }

  const app = document.getElementById('app');
  const ov  = Math.floor(mt.balls / 6), bl = mt.balls % 6;
  const crr = mt.balls > 0 ? ((mt.runs / mt.balls) * 6).toFixed(2) : '0.00';
  const need = inn1 ? inn1.runs + 1 - mt.runs : null;
  const left = s.overs * 6 - mt.balls;
  const rrr  = mt.innings === 2 && inn1 && left > 0 && need > 0
    ? ((need / left) * 6).toFixed(2) : null;

  let html = hdrH(`${esc(s.teamA)} vs ${esc(s.teamB)}`, !mt.done);

  // 1st innings strip
  if (mt.innings === 2 && inn1) {
    const i1ov = `${Math.floor(inn1.balls/6)}.${inn1.balls%6}`;
    html += `<div class="sec" style="padding:12px 16px">
      <div class="inn1-strip">
        <span class="inn1-lbl">1st Inn · ${esc(s.batFirst===s.team1?s.team1:s.team2)}</span>
        <span class="inn1-sc">${inn1.runs}/${inn1.wickets} (${i1ov} ov)</span>
      </div>
    </div>`;
  }

  // Scoreboard
  html += `<div class="sb" id="sb">
    <div class="sb-inn">${mt.innings===2?'2nd':'1st'} Innings</div>
    <div class="sb-team">${esc(mt.battingTeam)} Batting</div>
    <div class="sb-score">
      <span class="sb-runs">${mt.runs}</span>
      <span class="sb-wk">/${mt.wickets}</span>
    </div>
    <div class="sb-meta">
      <div class="smi"><div class="sml">Overs</div><div class="smv">${ov}.${bl}</div></div>
      <div class="smi"><div class="sml">${mt.innings===2?'RRR':'CRR'}</div><div class="smv">${rrr||crr}</div></div>
      <div class="smi"><div class="sml">Format</div><div class="smv">${s.overs}T</div></div>
      ${inn1?`<div class="smi"><div class="sml">Target</div><div class="smv" style="color:var(--ylw)">${inn1.runs+1}</div></div>`:''}
    </div>
    <div class="sb-bar"><div class="sb-fill" style="width:${Math.min(mt.balls/(s.overs*6)*100,100)}%"></div></div>
    ${mt.innings===2&&need>0?`<div class="target-row"><span class="target-lbl">Need</span><span class="target-val">${need} off ${left} balls</span></div>`:''}
  </div>`;

  // Current over
  html += `<div class="sec">
    <div class="sec-hd">
      <span class="sec-ttl">Current Over</span>
      <span style="font-size:11px;color:var(--ylw)">${mt.curBowler?esc(mt.curBowler):'—'}</span>
    </div>
    <div class="balls-row">${ballsH(mt)}</div>
    <div class="over-info">Over ${ov+1} · W:${mt.extras.wide} NB:${mt.extras.noball} B:${mt.extras.bye} LB:${mt.extras.legbye}</div>
  </div>`;

  // Batsmen
  const str = mt.bat[mt.striker];
  const ns  = mt.nonStriker !== -1 ? mt.bat[mt.nonStriker] : null;
  if (str) {
    html += `<div class="sec" style="padding:12px 16px">
      ${batH('⚡', str)}
      ${ns ? `<div class="bat-div"></div>${batH('🏏', ns)}` : ''}
    </div>`;
  }

  // Bowling
  if (mt.bowlOrder?.length) {
    html += `<div class="sec"><div class="sec-hd"><span class="sec-ttl">Bowling</span></div>`;
    mt.bowlOrder.forEach(name => {
      const b = mt.bowlMap[name]; if (!b) return;
      const bo = Math.floor(b.balls/6), br = b.balls%6;
      const eco = b.balls>0?((b.runs/b.balls)*6).toFixed(1):'—';
      html += `<div class="bfr">
        <span class="bfr-nm ${name===mt.curBowler?'cur':''}">${esc(name)}</span>
        <div class="bfr-st"><span>${bo}.${br}ov</span><span>${b.runs}r</span><span>${b.wickets}w</span><span>${eco}eco</span></div>
      </div>`;
    });
    html += `</div>`;
  }

  // Scorecard — always visible, auto-update
  html += `<div class="sec"><div class="sec-hd"><span class="sec-ttl">Scorecard</span></div>${scH(s,mt,inn1,inn1FullData)}</div>`;

  app.innerHTML = html;

  // Flash
  const sbEl = document.getElementById('sb');
  if (sbEl) {
    const last = (mt.curOver||[]).slice(-1)[0];
    if (last) {
      sbEl.classList.remove('flash-g','flash-r');
      void sbEl.offsetWidth;
      if (last.isW || last.extra) sbEl.classList.add('flash-r');
      else if (last.runs>=4) sbEl.classList.add('flash-g');
    }
  }
}

function renderResult(d) {
  const {setup:s,match:mt,inn1,inn1FullData,resultData} = d;
  let html = hdrH(`${esc(s.teamA)} vs ${esc(s.teamB)}`, false);
  html += `<div class="result-banner">
    <div class="res-trophy">${resultData.winnerTeam==='Tie'?'🤝':'🏆'}</div>
    <div class="res-msg">${esc(resultData.winnerMsg||'Match Complete')}</div>
    <div class="res-sub">${esc(s.teamA)} vs ${esc(s.teamB)} · ${s.overs} Overs</div>

  html += `<div class="sec"><div class="sec-hd"><span class="sec-ttl">Scorecard</span></div>${scH(s,mt,inn1,inn1FullData)}</div>`;
  document.getElementById('app').innerHTML = html;
  setPill(false); setMsg('Match ended');
  if (es) es.close();
}

function showNotFound() {
  document.getElementById('app').innerHTML = hdrH('',false) + `

// ─────────────────────────────────────────────
//  SCORECARD builder
// ─────────────────────────────────────────────
function scH(s, mt, inn1, inn1FullData) {
  let h = '';
  const inn1Team = s.batFirst===s.team1?s.team1:s.team2;
  const inn2Team = s.batFirst===s.team1?s.team2:s.team1;

  function batTable(arr, teamName, cls) {
    h += `<div class="sc-inn ${cls}"><span style="font-size:13px;font-weight:700">${esc(teamName)}</span></div>`;
    h += `<div class="sc-hd"><div class="sc-nm">Batter</div><div class="st st-r">R</div><div class="st st-b">B</div><div class="st st-4">4s</div><div class="st st-6">6s</div><div class="st st-sr">SR</div></div>`;
    arr.filter(b=>!b.notYet||b.out).forEach(b=>{
      const sr = b.balls>0?(b.runs/b.balls*100).toFixed(1):'—';
      h += `<div class="sc-row ${b.out?'sc-out':''}">
        <div class="sc-nm"><div class="sc-name">${esc(b.name)}</div><div class="sc-how">${b.out?esc(b.howOut):'not out'}</div></div>
        <div class="st st-r">${b.runs}</div><div class="st st-b">${b.balls}</div>
        <div class="st st-4">${b.fours}</div><div class="st st-6">${b.sixes}</div>
        <div class="st st-sr">${sr}</div>
      </div>`;
    });
  }

  function bowlTable(map, order) {
    h += `<div class="sc-hd" style="margin-top:8px"><div class="sc-nm">Bowler</div><div class="st st-ov">Ov</div><div class="st st-r">R</div><div class="st st-w">W</div><div class="st st-eco">Eco</div></div>`;
    (order||[]).forEach(name=>{
      const b=map[name]; if(!b) return;
      const bo=Math.floor(b.balls/6),br=b.balls%6;
      const eco=b.balls>0?(b.runs/b.balls*6).toFixed(2):'—';
      h += `<div class="sc-row">
        <div class="sc-nm"><div class="sc-name">${esc(name)}</div></div>
        <div class="st st-ov">${bo}.${br}</div><div class="st st-r">${b.runs}</div>
        <div class="st st-w">${b.wickets}</div><div class="st st-eco">${eco}</div>
      </div>`;
    });
  }

  if (inn1FullData && mt.innings===2) {
    batTable(inn1FullData.bat, inn1Team, '');
    const e=inn1FullData.extras;
    h+=`<div class="sc-ext">Extras: ${e.wide}wd ${e.noball}nb ${e.bye}b ${e.legbye}lb</div>`;
    bowlTable(inn1FullData.bowlMap, inn1FullData.bowlOrder);
  }

  batTable(mt.bat, mt.innings===2?inn2Team:inn1Team, inn1FullData?'inn2':'');
  const e=mt.extras;
  h+=`<div class="sc-ext">Extras: ${e.wide}wd ${e.noball}nb ${e.bye}b ${e.legbye}lb</div>`;
  bowlTable(mt.bowlMap, mt.bowlOrder);
  return h;
}

// ─────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────
function ballsH(mt) {
  let h='';
  (mt.curOver||[]).forEach(b=>{
    const cls=b.isW?'bW':b.extra==='wide'?'bw':b.extra==='noball'?'bnb':(b.extra==='bye'||b.extra==='legbye')?'bb':b.runs===4?'b4':b.runs===6?'b6':b.runs===0?'bd':'br';
    const lbl=b.isW?'W':b.extra==='wide'?'Wd':b.extra==='noball'?'NB':(b.extra==='bye'||b.extra==='legbye')?'B':b.runs===0?'·':b.runs;
    h+=`<div class="ball ${cls}">${lbl}</div>`;
  });
  const legal=(mt.curOver||[]).filter(b=>b.isLegal).length;
  for(let i=legal;i<6;i++) h+=`<div class="ball bgh">·</div>`;
  return h;
}

function batH(ico, b) {
  const sr=b.balls>0?((b.runs/b.balls)*100).toFixed(1):'0.0';
  return `<div class="bat-row">
    <div class="bat-ico">${ico}</div>
    <div style="flex:1;min-width:0">
      <div class="bat-nm">${esc(b.name)}</div>

function setPill(live) {
  const p=document.getElementById('livePill'); if(!p) return;
  p.className=live?'live-pill':'live-pill off';
  p.textContent=live?'Live':'Offline';
}
function setMsg(m) { const e=document.getElementById('btmMsg'); if(e) e.textContent=m; }
function setBtmTime() {
  const e=document.getElementById('btmTime');
  if(e) e.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false});
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ago(ts) {
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return `${s}s ago`;
  if(s<3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

// ─────────────────────────────────────────────
//  PWA
// ─────────────────────────────────────────────
function initPWA() {
  const KEY = 'pwa_hide_until';
  if (localStorage.getItem(KEY) > Date.now()) return;
  if (window.matchMedia('(display-mode:standalone)').matches) return;

  let prompt = null;
  const popup    = document.getElementById('pwa-popup');
  const installB = document.getElementById('pwa-install');
  const dismissB = document.getElementById('pwa-dismiss');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); prompt = e;
    setTimeout(() => popup.classList.add('show'), 4000);
  });

  installB.addEventListener('click', async () => {
    if (!prompt) return;
    prompt.prompt();
    const { outcome } = await prompt.userChoice;
    if (outcome === 'accepted') popup.classList.remove('show');
    prompt = null;
  });

  dismissB.addEventListener('click', () => {
    popup.classList.remove('show');
    localStorage.setItem(KEY, Date.now() + 3 * 864e5);
  });

  window.addEventListener('appinstalled', () => popup.classList.remove('show'));
}
</script>
</body>
</html>
