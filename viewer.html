<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Cricket Score — Live</title>
<meta name="theme-color" content="#242e42"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#111827;--bg2:#1a2332;--bg3:#242e42;--bg4:#2d3a52;
  --bdr:rgba(255,255,255,0.07);--text:#e6edf3;--t2:#a0aec0;--t3:#4a5568;
  --grn:#22c55e;--grn2:rgba(34,197,94,0.12);--ylw:#f0b429;
  --red:#f87171;--blue:#60a5fa;--blue2:#1565C0;
  --four:#3b82f6;--six:#f0b429;--rs:8px;
  --f:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding-bottom:56px}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg3);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px}
.hdr-name .bc{color:var(--blue)}.hdr-name .bs{color:var(--red)}
.live-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.5px;padding:4px 10px;border-radius:20px;background:var(--grn2);color:var(--grn)}
.live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--grn);animation:blink 1.2s infinite}
.live-pill.off{background:rgba(255,255,255,.04);color:var(--t3)}
.live-pill.off::before{background:var(--t3);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* State screens */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;text-align:center;padding:32px 20px}
.state-ico{font-size:48px}.state-ttl{font-size:20px;font-weight:700}.state-sub{font-size:14px;color:var(--t2);line-height:1.6}

/* Scoreboard */
.sb{background:linear-gradient(135deg,#1e2d45,#111827);padding:20px 16px 16px;border-bottom:1px solid var(--bdr);position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;top:-60px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(21,101,192,.18),transparent 70%);pointer-events:none}
.sb-inn{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.sb-team{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:6px}
.sb-score-row{display:flex;align-items:baseline;gap:4px;margin-bottom:12px}
.sb-runs{font-family:var(--fm);font-size:52px;font-weight:700;line-height:1}
.sb-wk{font-family:var(--fm);font-size:28px;font-weight:700;color:var(--t2)}
.sb-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.smi{display:flex;flex-direction:column;gap:1px}
.sml{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
.smv{font-family:var(--fm);font-size:15px;font-weight:700}
.sb-bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.sb-fill{height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:2px;transition:width .5s ease}
.target-row{display:flex;align-items:center;justify-content:space-between;background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.18);border-radius:6px;padding:10px 14px;margin-top:12px}
.target-lbl{font-size:11px;color:var(--ylw);font-weight:600}
.target-val{font-family:var(--fm);font-size:18px;font-weight:700;color:var(--ylw)}

/* Inn1 strip */
.inn1-strip{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.15);border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.inn1-lbl{font-size:11px;color:var(--blue);font-weight:600}
.inn1-score{font-family:var(--fm);font-size:16px;font-weight:700}

/* Section */
.sec{padding:14px 16px;border-bottom:1px solid var(--bdr)}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-ttl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3)}

/* Balls */
.balls-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ball{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--fm)}
.bd{background:rgba(255,255,255,.05);color:var(--t3)}
.bgh{background:rgba(255,255,255,.03);color:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.06)}
.b4{background:rgba(59,130,246,.2);color:var(--four);border:1px solid rgba(59,130,246,.3)}
.b6{background:rgba(240,180,41,.18);color:var(--six);border:1px solid rgba(240,180,41,.3)}
.bW{background:rgba(248,113,113,.2);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.bw{background:rgba(248,113,113,.1);color:var(--red);font-size:10px}
.bnb{background:rgba(251,191,36,.1);color:#fbbf24;font-size:10px}
.bb{background:rgba(96,165,250,.1);color:var(--blue);font-size:10px}
.br{background:rgba(34,197,94,.15);color:var(--grn)}
.over-info{font-size:11px;color:var(--t3);margin-top:4px}

/* Batsmen */
.bat-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.bat-ico{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.bat-nm{font-size:14px;font-weight:600}
.bat-st{font-size:12px;color:var(--t2);margin-top:2px;font-family:var(--fm)}
.bat-st .c4{color:var(--four)}.bat-st .c6{color:var(--six)}
.bat-div{height:1px;background:var(--bdr);margin:2px 0}

/* Bowl */
.bfr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.bfr:last-child{border-bottom:none}
.bfr-nm{font-size:13px;font-weight:600;min-width:100px;flex-shrink:0}
.bfr-nm.cur{color:var(--ylw)}
.bfr-stats{display:flex;gap:12px;font-size:12px;font-family:var(--fm);color:var(--t2)}

/* Scorecard */
.sc-toggle{width:100%;padding:10px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--rs);color:var(--t2);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.sc-inn-hd{display:flex;align-items:center;justify-content:space-between;background:rgba(21,101,192,.15);border-left:3px solid var(--blue2);padding:10px 12px;border-radius:0 6px 6px 0;margin:12px 0 8px}
.sc-inn-hd.inn2{background:rgba(185,28,28,.12);border-left-color:#991b1b}
.sc-tbl-hd{display:flex;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
.sc-row{display:flex;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03);align-items:center}
.sc-nm{flex:1;font-size:13px;min-width:0}
.sc-nm-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-nm-sub{font-size:10px;color:var(--t3);margin-top:1px}
.sc-stat{font-family:var(--fm);font-size:13px;text-align:right;flex-shrink:0}
.sc-r{width:32px;color:var(--grn)}.sc-b{width:38px;color:var(--t2)}
.sc-4{width:26px;color:var(--four)}.sc-6{width:26px;color:var(--six)}.sc-sr{width:44px}
.sc-ov{width:36px}.sc-w{width:24px;color:var(--red)}.sc-eco{width:42px}
.sc-extras{font-size:11px;color:var(--t3);padding:6px 0;border-top:1px solid var(--bdr);margin-top:4px}
.sc-out .sc-nm-name{color:var(--t2)}

/* Result */
.result-banner{background:linear-gradient(135deg,rgba(21,101,192,.2),rgba(240,180,41,.1));border:1px solid rgba(240,180,41,.25);border-radius:var(--rs);padding:20px 16px;text-align:center;margin:16px}
.result-trophy{font-size:36px;margin-bottom:8px}
.result-msg{font-size:18px;font-weight:700;margin-bottom:4px}
.result-sub{font-size:13px;color:var(--t2)}

/* Bottom bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg3);border-top:1px solid var(--bdr);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--t3);z-index:40}
.bottom-time{font-family:var(--fm);color:var(--t2);font-weight:600}

/* Flash animation */
@keyframes flash-g{0%,100%{background:linear-gradient(135deg,#1e2d45,#111827)}50%{background:linear-gradient(135deg,rgba(34,197,94,.15),#111827)}}
@keyframes flash-r{0%,100%{background:linear-gradient(135deg,#1e2d45,#111827)}50%{background:linear-gradient(135deg,rgba(248,113,113,.15),#111827)}}
.flash-g{animation:flash-g .6s ease}
.flash-r{animation:flash-r .6s ease}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="hdr">
    <div class="hdr-brand">
      <div class="hdr-name"><span class="bc">CRICKET</span> <span class="bs">SCORE</span></div>
    </div>
    <span class="live-pill off" id="livePill">Connecting…</span>
  </div>
  <div class="state"><div class="state-ico">⏳</div><div class="state-sub">Connecting to live stream…</div></div>
</div>
<div class="bottom-bar">
  <span id="statusMsg">—</span>
  <span class="bottom-time" id="lastUpdate">—</span>
</div>

<script>
const API = window.location.origin;
const params  = new URLSearchParams(location.search);
const matchId = params.get('match') || params.get('matchId');

let scOpen = false;
let es     = null;
let data   = null;

// ── Boot ──────────────────────────────────────
if (!matchId) {
  document.getElementById('app').innerHTML = `
    <div class="hdr"><div class="hdr-brand"><div class="hdr-name"><span class="bc">CRICKET</span> <span class="bs">SCORE</span></div></div></div>
    <div class="state"><div class="state-ico">🔍</div><div class="state-ttl">No match selected</div><div class="state-sub">Open a viewer link from the scorer app.</div></div>`;
} else {
  connect();
}

// ── SSE Connection ────────────────────────────
function connect() {
  if (es) es.close();

  es = new EventSource(`${API}/api/live?matchId=${encodeURIComponent(matchId)}`);

  es.onopen = () => {
    setPill(true);
    setStatus('Live stream connected');
  };

  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.error === 'not_found') {
      showNotFound(); return;
    }
    data = d;
    render(d);
    setLastUpdate();
  };

  es.addEventListener('reconnect', () => {
    es.close();
    setTimeout(connect, 500); // সাথে সাথে reconnect
  });

  es.onerror = () => {
    setPill(false);
    setStatus('Reconnecting…');
    es.close();
    setTimeout(connect, 3000);
  };
}

// ── Render ────────────────────────────────────
function render(d) {
  const { setup: s, match: m, inn1, inn1FullData, screen, resultData } = d;
  if (!s || !m) return;

  if (screen === 'result' && resultData) {
    renderResult(d); return;
  }

  const app   = document.getElementById('app');
  const ov    = Math.floor(m.balls / 6), bl = m.balls % 6;
  const crr   = m.balls > 0 ? ((m.runs / m.balls) * 6).toFixed(2) : '0.00';
  const inn1Runs = inn1 ? inn1.runs : null;
  const need  = inn1Runs !== null ? inn1Runs + 1 - m.runs : null;
  const left  = s.overs * 6 - m.balls;
  const rrr   = (m.innings === 2 && inn1 && left > 0 && need > 0)
    ? ((need / left) * 6).toFixed(2) : null;

  let html = hdrHTML();

  // 1st innings strip
  if (m.innings === 2 && inn1) {
    const i1ov = `${Math.floor(inn1.balls/6)}.${inn1.balls%6}`;
    html += `<div class="sec" style="padding:12px 16px">
      <div class="inn1-strip">
        <span class="inn1-lbl">1st Inn · ${esc(s.batFirst === s.team1 ? s.team1 : s.team2)}</span>
        <span class="inn1-score">${inn1.runs}/${inn1.wickets} (${i1ov} ov)</span>
      </div>
    </div>`;
  }

  // Scoreboard
  html += `<div class="sb" id="sb">
    <div class="sb-inn">${m.innings === 2 ? '2nd' : '1st'} Innings</div>
    <div class="sb-team">${esc(m.battingTeam)} Batting</div>
    <div class="sb-score-row">
      <span class="sb-runs">${m.runs}</span>
      <span class="sb-wk">/${m.wickets}</span>
    </div>
    <div class="sb-meta">
      <div class="smi"><div class="sml">Overs</div><div class="smv">${ov}.${bl}</div></div>
      <div class="smi"><div class="sml">${m.innings===2?'RRR':'CRR'}</div><div class="smv">${rrr||crr}</div></div>
      <div class="smi"><div class="sml">Format</div><div class="smv">${s.overs}T</div></div>
      ${inn1 ? `<div class="smi"><div class="sml">Target</div><div class="smv" style="color:var(--ylw)">${inn1.runs+1}</div></div>` : ''}
    </div>
    <div class="sb-bar"><div class="sb-fill" style="width:${Math.min(m.balls/(s.overs*6)*100,100)}%"></div></div>
    ${m.innings===2 && need>0 ? `<div class="target-row"><span class="target-lbl">Need</span><span class="target-val">${need} off ${left} balls</span></div>` : ''}
  </div>`;

  // Current over
  html += `<div class="sec">
    <div class="sec-hd">
      <span class="sec-ttl">Current Over</span>
      <span style="font-size:11px;color:var(--ylw)">${m.curBowler ? esc(m.curBowler) : '—'}</span>
    </div>
    <div class="balls-row">${ballsHTML(m)}</div>
    <div class="over-info">Over ${ov+1} · W:${m.extras.wide} NB:${m.extras.noball} B:${m.extras.bye} LB:${m.extras.legbye}</div>
  </div>`;

  // Batsmen
  const str  = m.bat[m.striker];
  const ns   = m.nonStriker !== -1 ? m.bat[m.nonStriker] : null;
  if (str) {
    html += `<div class="sec" style="padding:12px 16px">
      ${batRowHTML('⚡', str)}
      ${ns ? `<div class="bat-div"></div>${batRowHTML('🏏', ns)}` : ''}
    </div>`;
  }

  // Bowling
  if (m.bowlOrder?.length) {
    html += `<div class="sec"><div class="sec-hd"><span class="sec-ttl">Bowling</span></div>`;
    m.bowlOrder.forEach(name => {
      const b = m.bowlMap[name]; if (!b) return;
      const bov = Math.floor(b.balls/6), brb = b.balls%6;
      const eco = b.balls > 0 ? ((b.runs/b.balls)*6).toFixed(1) : '—';
      html += `<div class="bfr">
        <span class="bfr-nm ${name===m.curBowler?'cur':''}">${esc(name)}</span>
        <div class="bfr-stats"><span>${bov}.${brb}ov</span><span>${b.runs}r</span><span>${b.wickets}w</span><span>${eco}eco</span></div>
      </div>`;
    });
    html += `</div>`;
  }

  // Scorecard toggle
  html += `<div class="sec">
    <button class="sc-toggle" onclick="toggleSC()">📋 SCORECARD</button>
    <div id="scPanel" style="display:${scOpen?'block':'none'}">
      ${scOpen ? scorecardHTML(s, m, inn1, inn1FullData) : ''}
    </div>
  </div>`;

  app.innerHTML = html;

  // Flash
  const sbEl = document.getElementById('sb');
  if (sbEl && data) {
    const last = (m.curOver||[]).slice(-1)[0];
    if (last) {
      sbEl.classList.remove('flash-g','flash-r');
      void sbEl.offsetWidth;
      sbEl.classList.add(last.isW || last.extra ? 'flash-r' : (last.runs>=4?'flash-g':''));
    }
  }
}

function renderResult(d) {
  const { setup: s, match: m, inn1FullData, resultData } = d;
  const { winnerMsg, winnerTeam } = resultData;
  let html = hdrHTML();
  html += `<div class="result-banner">
    <div class="result-trophy">${winnerTeam==='Tie'?'🤝':'🏆'}</div>
    <div class="result-msg">${esc(winnerMsg||'Match Complete')}</div>
    <div class="result-sub">${esc(s.teamA)} vs ${esc(s.teamB)} · ${s.overs} Overs</div>
  </div>`;
  html += `<div class="sec">${scorecardHTML(s, m, d.inn1, inn1FullData)}</div>`;
  document.getElementById('app').innerHTML = html;
  setPill(false);
  setStatus('Match ended');
  if (es) es.close();
}

// ── Scorecard ─────────────────────────────────
function scorecardHTML(s, m, inn1, inn1FullData) {
  let h = '';
  const inn1Team = s.batFirst === s.team1 ? s.team1 : s.team2;
  const inn2Team = s.batFirst === s.team1 ? s.team2 : s.team1;

  function batTable(arr, teamName, cls) {
    h += `<div class="sc-inn-hd ${cls}">
      <span style="font-size:13px;font-weight:700">${esc(teamName)}</span>
    </div>
    <div class="sc-tbl-hd">
      <div class="sc-nm">Batter</div>
      <div class="sc-stat sc-r">R</div><div class="sc-stat sc-b">B</div>
      <div class="sc-stat sc-4">4s</div><div class="sc-stat sc-6">6s</div>
      <div class="sc-stat sc-sr">SR</div>
    </div>`;
    arr.filter(b => !b.notYet || b.out).forEach(b => {
      const sr = b.balls > 0 ? (b.runs/b.balls*100).toFixed(1) : '—';
      h += `<div class="sc-row ${b.out?'sc-out':''}">
        <div class="sc-nm">
          <div class="sc-nm-name">${esc(b.name)}</div>
          <div class="sc-nm-sub">${b.out?esc(b.howOut):'not out'}</div>
        </div>
        <div class="sc-stat sc-r">${b.runs}</div>
        <div class="sc-stat sc-b">${b.balls}</div>
        <div class="sc-stat sc-4">${b.fours}</div>
        <div class="sc-stat sc-6">${b.sixes}</div>
        <div class="sc-stat sc-sr">${sr}</div>
      </div>`;
    });
  }

  function bowlTable(map, order) {
    h += `<div class="sc-tbl-hd" style="margin-top:8px">
      <div class="sc-nm">Bowler</div>
      <div class="sc-stat sc-ov">Ov</div>
      <div class="sc-stat sc-r">R</div>
      <div class="sc-stat sc-w">W</div>
      <div class="sc-stat sc-eco">Eco</div>
    </div>`;
    (order||[]).forEach(name => {
      const b = map[name]; if (!b) return;
      const bov = Math.floor(b.balls/6), brb = b.balls%6;
      const eco = b.balls>0 ? (b.runs/b.balls*6).toFixed(2) : '—';
      h += `<div class="sc-row">
        <div class="sc-nm"><div class="sc-nm-name">${esc(name)}</div></div>
        <div class="sc-stat sc-ov">${bov}.${brb}</div>
        <div class="sc-stat sc-r">${b.runs}</div>
        <div class="sc-stat sc-w">${b.wickets}</div>
        <div class="sc-stat sc-eco">${eco}</div>
      </div>`;
    });
  }

  if (inn1FullData && m.innings === 2) {
    batTable(inn1FullData.bat, inn1Team, '');
    const e = inn1FullData.extras;
    h += `<div class="sc-extras">Extras: ${e.wide}wd ${e.noball}nb ${e.bye}b ${e.legbye}lb</div>`;
    bowlTable(inn1FullData.bowlMap, inn1FullData.bowlOrder);
  }

  batTable(m.bat, m.innings===2 ? inn2Team : inn1Team, inn1FullData ? 'inn2' : '');
  const e2 = m.extras;
  h += `<div class="sc-extras">Extras: ${e2.wide}wd ${e2.noball}nb ${e2.bye}b ${e2.legbye}lb</div>`;
  bowlTable(m.bowlMap, m.bowlOrder);
  return h;
}

function toggleSC() {
  scOpen = !scOpen;
  const p = document.getElementById('scPanel');
  if (!p) return;
  p.style.display = scOpen ? 'block' : 'none';
  if (scOpen && data) {
    p.innerHTML = scorecardHTML(data.setup, data.match, data.inn1, data.inn1FullData);
  }
}

// ── Helpers ───────────────────────────────────
function ballsHTML(m) {
  let h = '';
  (m.curOver||[]).forEach(b => {
    const cls = b.isW?'bW':b.extra==='wide'?'bw':b.extra==='noball'?'bnb':(b.extra==='bye'||b.extra==='legbye')?'bb':b.runs===4?'b4':b.runs===6?'b6':b.runs===0?'bd':'br';
    const lbl = b.isW?'W':b.extra==='wide'?'Wd':b.extra==='noball'?'NB':(b.extra==='bye'||b.extra==='legbye')?'B':b.runs===0?'·':b.runs;
    h += `<div class="ball ${cls}">${lbl}</div>`;
  });
  const legal = (m.curOver||[]).filter(b=>b.isLegal).length;
  for (let i=legal;i<6;i++) h += `<div class="ball bgh">·</div>`;
  return h;
}

function batRowHTML(ico, b) {
  const sr = b.balls>0 ? ((b.runs/b.balls)*100).toFixed(1) : '0.0';
  return `<div class="bat-row">
    <div class="bat-ico">${ico}</div>
    <div style="flex:1;min-width:0">
      <div class="bat-nm">${esc(b.name)}</div>
      <div class="bat-st"><b>${b.runs}</b>(${b.balls}) · <span class="c4">4s:${b.fours}</span> <span class="c6">6s:${b.sixes}</span> · SR:${sr}</div>
    </div>
  </div>`;
}

function hdrHTML() {
  return `<div class="hdr">
    <div class="hdr-brand"><div class="hdr-name"><span class="bc">CRICKET</span> <span class="bs">SCORE</span></div></div>
    <span class="live-pill" id="livePill">Live</span>
  </div>`;
}

function showNotFound() {
  document.getElementById('app').innerHTML = hdrHTML() + `
    <div class="state">
      <div class="state-ico">🔍</div>
      <div class="state-ttl">Match not found</div>
      <div class="state-sub">Match ended or link is invalid.<br>Matches expire after 6 hours.</div>
    </div>`;
  if (es) es.close();
}

function setPill(live) {
  const p = document.getElementById('livePill');
  if (!p) return;
  p.className = live ? 'live-pill' : 'live-pill off';
  p.textContent = live ? 'Live' : 'Offline';
}

function setStatus(msg) {
  const el = document.getElementById('statusMsg');
  if (el) el.textContent = msg;
}

function setLastUpdate() {
  const el = document.getElementById('lastUpdate');
  if (el) el.textContent = new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
